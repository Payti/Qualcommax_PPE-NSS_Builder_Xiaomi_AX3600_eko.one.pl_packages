name: Build PPE-NSS

# Builds the PPE-NSS and PPE-NSS-MESH images for the Xiaomi AX3600:
#   check -> build (matrix: ppe-nss, ppe-nss-mesh) -> prune
# All build parameters live in the `env:` block below — it is the one file you edit.
on:
  workflow_dispatch:
    inputs:
      enable_tmate:
        description: 'Enable tmate SSH debug session for this manual run'
        required: false
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'
  push:
    branches: [main]
    paths:
      - 'devices/**'
      - 'patches/**'
      - 'scripts/**'
      - '.github/workflows/build*.yml'
  schedule:
    - cron: "0 */2 * * *"

concurrency:
  group: build-ppe-nss-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  UPSTREAM_REPO: JuliusBairaktaris/openwrt-ppe-nss
  UPSTREAM_REF: ppe-nss
  NSS_REPO: JuliusBairaktaris/nss-packages
  NSS_REF: edma-nss
  VARIANT: ppe-nss
  TARGET: qualcommax/ipq807x
  DEVICE: xiaomi_ax3600
  DEVICE_DIR: devices/xiaomi_ax3600
  RELEASE_PREFIX: ppe-nss
  KEEP: "4"
  FEEDS: |
    src-git nss https://github.com/JuliusBairaktaris/nss-packages.git;edma-nss
    src-git luci https://github.com/JuliusBairaktaris/luci.git;luci-app-ppe-qos
    src-git obsy https://github.com/obsy/packages

jobs:
  check:
    name: Check upstream
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      EVENT_NAME: ${{ github.event_name }}
    outputs:
      upstream_sha: ${{ steps.check.outputs.upstream_sha || steps.check.outputs.sha }}
      nss_sha: ${{ steps.check.outputs.nss_sha }}
      need: ${{ steps.check.outputs.need }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: bash scripts/check-updates.sh

  build:
    name: Build OpenWrt (${{ matrix.variant }})
    needs: check
    if: needs.check.outputs.need == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: ppe-nss
            nss_fw: "12.5"
            mesh_support: "no"
            title_label: "PPE-NSS (NSS FW 12.5) "
          - variant: ppe-nss-mesh
            nss_fw: "11.4"
            mesh_support: "yes"
            title_label: "PPE-NSS MESH (NSS FW 11.4) "
    env:
      GH_TOKEN: ${{ github.token }}
      VARIANT: ${{ matrix.variant }}
      NSS_FW_VERSION: ${{ matrix.nss_fw }}
    steps:
      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update || true
          sudo apt-get install -y \
            bzip2 g++ gawk gcc git glibc-source libncurses-dev make rsync mc

      - name: Start tmate session for SSH login
        if: ${{ github.event_name == 'workflow_dispatch' && github.actor == 'Payti' && inputs.enable_tmate == 'yes' }}
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          swap-storage: false

      - name: Checkout OpenWrt source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.check.outputs.upstream_sha || env.UPSTREAM_REF }}
          fetch-depth: 0
          path: openwrt

      - name: Checkout builder repo
        uses: actions/checkout@v7
        with:
          path: builder

      - name: Prepare build environment (Feeds, Tree & Feed Patches, Overlay, Base Config)
        env:
          OPENWRT_DIR: ${{ github.workspace }}/openwrt
          BUILDER_REPO: ${{ github.workspace }}/builder
          NSS_SHA: ${{ needs.check.outputs.nss_sha }}
          RUN_FEEDS_IN_PREPARE: "1"
        run: |
          chmod +x builder/scripts/prepare-build.sh
          bash builder/scripts/prepare-build.sh

      - name: Finalize feeds, Polish i18n, TEE and variant config (${{ matrix.variant }})
        run: |
          set -euo pipefail
          OPENWRT_DIR="${{ github.workspace }}/openwrt"
          OPENWRT_CONFIG="${OPENWRT_DIR}/.config"
          DEVICE_CONFIG="${{ github.workspace }}/builder/${{ env.DEVICE_DIR }}/config"

          echo "### Usuwanie pakietów dahdi-linux, rtl8812au-ct, xdp-tools ###"
          rm -rf "${OPENWRT_DIR}/package/feeds/telephony/dahdi-linux"
          rm -rf "${OPENWRT_DIR}/package/kernel/rtl8812au-ct"
          rm -rf "${OPENWRT_DIR}/package/network/utils/xdp-tools"

          # Zabezpieczenie iproute2 przed pustym --libbpf_force=
          sed -i 's/--libbpf_force=\$(IPROUTE2_LIBBPF_FORCE)/--libbpf_force=\$(if \$(IPROUTE2_LIBBPF_FORCE),\$(IPROUTE2_LIBBPF_FORCE),off)/g' "${OPENWRT_DIR}/package/network/utils/iproute2/Makefile" || true

          if [ ! -f "$OPENWRT_CONFIG" ] && [ -f "$DEVICE_CONFIG" ]; then
            cp "$DEVICE_CONFIG" "$OPENWRT_CONFIG"
          fi

          # 1. Konfiguracja wariantu: ppe-nss (FW 12.5) vs ppe-nss-mesh (FW 11.4 + Mesh)
          sed -i '/CONFIG_NSS_FIRMWARE_VERSION_12_5/d' "$OPENWRT_CONFIG"
          sed -i '/CONFIG_NSS_FIRMWARE_VERSION_11_4/d' "$OPENWRT_CONFIG"
          sed -i '/CONFIG_ATH11K_NSS_MESH_SUPPORT/d' "$OPENWRT_CONFIG"

          if [ "${{ matrix.mesh_support }}" = "yes" ]; then
            echo "--> Konfiguracja wariantu ppe-nss-mesh (NSS FW 11.4 + ATH11K_NSS_MESH_SUPPORT)"
            sed -i '/CONFIG_PACKAGE_wpad-mbedtls/d' "$OPENWRT_CONFIG"
            printf '%s\n' \
              'CONFIG_PACKAGE_kmod-qca-ppe-nss=y' \
              'CONFIG_PACKAGE_kmod-qca-nss-drv=y' \
              '# CONFIG_NSS_FIRMWARE_VERSION_12_5 is not set' \
              'CONFIG_NSS_FIRMWARE_VERSION_11_4=y' \
              'CONFIG_ATH11K_NSS_MESH_SUPPORT=y' \
              '# CONFIG_PACKAGE_wpad-mbedtls is not set' \
              'CONFIG_PACKAGE_wpad-mesh-mbedtls=y' >> "$OPENWRT_CONFIG"
          else
            echo "--> Konfiguracja wariantu ppe-nss (NSS FW 12.5)"
            printf '%s\n' \
              'CONFIG_PACKAGE_kmod-qca-ppe-nss=y' \
              'CONFIG_PACKAGE_kmod-qca-nss-drv=y' \
              'CONFIG_NSS_FIRMWARE_VERSION_12_5=y' \
              '# CONFIG_NSS_FIRMWARE_VERSION_11_4 is not set' \
              '# CONFIG_ATH11K_NSS_MESH_SUPPORT is not set' >> "$OPENWRT_CONFIG"
          fi

          # 2. Dopisanie deklaracji jądra TEE do config-6.18
          KERNEL_CONFIG_TARGET=$(find "${OPENWRT_DIR}/target/linux/qualcommax/" -name "config-6.18" | head -n 1)
          if [ -n "$KERNEL_CONFIG_TARGET" ] && [ -f "$KERNEL_CONFIG_TARGET" ]; then
            printf '%s\n' \
              'CONFIG_TEE=m' \
              'CONFIG_OPTEE=m' \
              'CONFIG_QCOMTEE=m' \
              '# CONFIG_OPTEE_INSECURE_LOAD_IMAGE is not set' >> "$KERNEL_CONFIG_TARGET"
            echo "--> SUCCESS: Dopisano deklaracje jądra TEE do $KERNEL_CONFIG_TARGET"
          fi

          # 3. Systemowe scalenie polskich tłumaczeń i18n dla PPE-NSS
          SOURCE_PO_DIR="${{ github.workspace }}/builder/${{ env.DEVICE_DIR }}/po/pl"
          PPE_LUCI_PO_SOURCE="$SOURCE_PO_DIR/luci-app-ppe-qos.po"
          PPE_LUCI_APP_DIR=$(find "${OPENWRT_DIR}/feeds/luci" -type d -name "luci-app-ppe-qos" | head -n 1)
          if [ -f "$PPE_LUCI_PO_SOURCE" ] && [ -n "$PPE_LUCI_APP_DIR" ] && [ -d "$PPE_LUCI_APP_DIR" ]; then
            mkdir -p "$PPE_LUCI_APP_DIR/po/pl"
            cp "$PPE_LUCI_PO_SOURCE" "$PPE_LUCI_APP_DIR/po/pl/luci-app-ppe-qos.po"
            echo "--> SUCCESS: Dodano polskie tłumaczenie luci-app-ppe-qos do feedu LuCI"
          fi

          LUCI_BASE_PO="${OPENWRT_DIR}/feeds/luci/modules/luci-base/po/pl/base.po"
          if [ ! -f "$LUCI_BASE_PO" ]; then
            LUCI_BASE_PO=$(find "${OPENWRT_DIR}/" -path "*/luci-base/po/pl/base.po" | head -n 1)
          fi

          if [ -n "$LUCI_BASE_PO" ] && [ -f "$LUCI_BASE_PO" ]; then
            for SOURCE_PO in "$SOURCE_PO_DIR/luci-app-ppe-qos.po" "$SOURCE_PO_DIR/luci-mod-status-nss.po"; do
              if [ -f "$SOURCE_PO" ]; then
                {
                  printf '\n'
                  awk 'BEGIN { header=1 } header && /^$/ { header=0; next } !header { print }' "$SOURCE_PO"
                } >> "$LUCI_BASE_PO"
                echo "--> SUCCESS: Scalono $(basename "$SOURCE_PO" .po) z po/pl/base.po"
              fi
            done
          fi

          # 4. Przeliczenie drzewa zależności konfiguracji i blokada CONFIG_FEED_*
          make -C "$OPENWRT_DIR" defconfig FORCE=1
          sed -i 's/^CONFIG_FEED_nss=.*/# CONFIG_FEED_nss is not set/' "$OPENWRT_CONFIG" || true
          sed -i 's/^CONFIG_FEED_obsy=.*/# CONFIG_FEED_obsy is not set/' "$OPENWRT_CONFIG" || true
          sed -i 's/^CONFIG_FEED_luci_extra=.*/# CONFIG_FEED_luci_extra is not set/' "$OPENWRT_CONFIG" || true

      - name: Dynamically update custom OpenWrt banner info
        working-directory: openwrt
        run: |
          set -euo pipefail

          if [ -f scripts/getver.sh ]; then
            OPENWRT_VERSION_RAW=$(bash scripts/getver.sh)
          else
            OPENWRT_VERSION_RAW=$(git rev-parse --short=10 HEAD)
          fi

          OPENWRT_VERSION="OpenWrt SNAPSHOT, ${OPENWRT_VERSION_RAW}"
          CURRENT_BUILD_TIME=$(date -u +"%Y-%m-%d %H:%M UTC")

          if [ -f files/etc/banner ]; then
            VERSION_LINE="OpenWrt SNAPSHOT, ${OPENWRT_VERSION_RAW} (${{ matrix.variant }}, FW ${{ matrix.nss_fw }})"
            DATE_LINE="Build time: $CURRENT_BUILD_TIME"

            VERSION_PADDING=$(printf '\%-74s' "$VERSION_LINE")
            FINAL_VERSION_ROW=" | ${VERSION_PADDING}|"

            DATE_PADDING=$(printf '\%-74s' "$DATE_LINE")
            FINAL_DATE_ROW=" | ${DATE_PADDING}|"

            sed -i "s#.*VERSION_PLACEHOLDER.*#$FINAL_VERSION_ROW#g" files/etc/banner
            sed -i "s#.*DATE_PLACEHOLDER.*#$FINAL_DATE_ROW#g" files/etc/banner

            echo "Successfully injected real git version and build time into ${{ matrix.variant }} banner."
          else
            echo "::warning::Custom banner file was not deployed by prepare-build.sh to openwrt/files/etc/banner"
            VERSION_LINE="OpenWrt SNAPSHOT"
            FINAL_VERSION_ROW=""
            DATE_LINE=""
            FINAL_DATE_ROW=""
          fi

          TARGET_RELEASE_FILE="package/base-files/files/etc/openwrt_release"
          DISTRIB_DESCRIPTION="${OPENWRT_VERSION} (${{ matrix.variant }} [NSS FW ${{ matrix.nss_fw }}] build by @Payti)"
          if [ -f "$TARGET_RELEASE_FILE" ]; then
            sed -i '/DISTRIB_DESCRIPTION=/d' "$TARGET_RELEASE_FILE" || true
            echo "DISTRIB_DESCRIPTION='${DISTRIB_DESCRIPTION}'" >> "$TARGET_RELEASE_FILE"
          fi

          echo "=================================================="
          echo "VARIANT:                ${{ matrix.variant }} (NSS FW ${{ matrix.nss_fw }})"
          echo "OPENWRT_VERSION:        $OPENWRT_VERSION"
          echo "CURRENT_BUILD_TIME:     $CURRENT_BUILD_TIME"
          echo "VERSION_LINE:           ${VERSION_LINE:-}"
          echo "DATE_LINE:              ${DATE_LINE:-}"
          echo "=================================================="

      - name: Set reproducible-build env
        working-directory: openwrt
        run: |
          set -euo pipefail
          {
            echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)"
            echo "TZ=UTC"
            echo "LC_ALL=C"
            echo "KBUILD_BUILD_USER=builder"
            echo "KBUILD_BUILD_HOST=github"
          } >>"$GITHUB_ENV"

      - name: Download sources
        working-directory: openwrt
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            make download -j"$(nproc)" V=s && break
            echo "Download attempt $attempt failed; retrying..."
            sleep 5
          done

      - name: Build
        working-directory: openwrt
        run: |
          set -euo pipefail
          make -j"$(nproc)" || make -j1 V=s

      - name: Pack APK Packages
        working-directory: openwrt
        run: |
          echo "### Pakowanie skompilowanych pakietów .apk (${{ matrix.variant }}) ###"
          if [ -d "bin/packages" ]; then
            tar -czf bin/targets/${{ env.TARGET }}/compiled_packages.tar.gz -C bin packages
            echo "-> Pakiety zostały pomyślnie spakowane do compiled_packages.tar.gz"
          else
            echo "-> OSTRZEŻENIE: Nie znaleziono katalogu bin/packages!"
          fi

      - name: Publish release (${{ matrix.variant }})
        id: release
        env:
          UPSTREAM_SHA: ${{ needs.check.outputs.upstream_sha }}
          NSS_SHA: ${{ needs.check.outputs.nss_sha }}
        run: |
          set -euo pipefail
          date=$(date -u +%F)
          timestamp=$(date -u +%Y%m%dT%H%M%SZ)
          tag_name="${{ matrix.variant }}-${timestamp}-${GITHUB_RUN_ID}-offload"
          echo "release_tag=$tag_name" >>"$GITHUB_OUTPUT"

          {
            echo "## OpenWrt Build — ${{ matrix.title_label }}"
            echo "- **Date**: $date"
            echo "- **Variant**: \`${{ matrix.variant }}\`"
            echo "- **NSS Firmware**: \`${{ matrix.nss_fw }}\`"
            echo "- **802.11s NSS Mesh Offload**: \`${{ matrix.mesh_support }}\`"
            echo "- **Device**: \`${{ env.DEVICE }}\`"
            echo "- **Target**: \`${{ env.TARGET }}\`"
            echo "- **Upstream**: \`${{ env.UPSTREAM_REPO }}@${UPSTREAM_SHA}\` (branch \`${{ env.UPSTREAM_REF }}\`)"
            echo "- **NSS Packages**: \`${{ env.NSS_REPO }}@${NSS_SHA}\` (branch \`${{ env.NSS_REF }}\`)"
            echo "- **Trigger**: \`${GITHUB_EVENT_NAME}\`"
            echo "- **Compiled by**: @Payti"
          } >release_notes.md

          mapfile -t assets < <(find "openwrt/bin/targets/${TARGET}/" -type f -not -path "*/packages/*")

          for asset in "${assets[@]}"; do
            dir=$(dirname "$asset")
            base=$(basename "$asset")
            clean_base="${base#ppe-nss-mesh-}"
            clean_base="${clean_base#ppe-nss-}"
            clean_base="${clean_base#ppe-}"
            mv "$asset" "$dir/${{ matrix.variant }}-$clean_base"
          done

          mapfile -t renamed_assets < <(find "openwrt/bin/targets/${TARGET}/" -type f -not -path "*/packages/*")

          gh release create "$tag_name" \
            --repo "$GITHUB_REPOSITORY" \
            --title "OpenWrt ${{ matrix.title_label }}$date" \
            --notes-file release_notes.md \
            "${renamed_assets[@]}"

          {
            echo "## Release (${{ matrix.variant }})"
            echo "- tag: \`${tag_name}\`"
            echo "- NSS FW: \`${{ matrix.nss_fw }}\`"
            echo "- assets: ${#renamed_assets[@]}"
          } >>"$GITHUB_STEP_SUMMARY"

  prune:
    name: Prune old releases
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - name: Prune
        run: bash scripts/prune-releases.sh
